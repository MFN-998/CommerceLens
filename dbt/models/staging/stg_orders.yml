version: 2

models:
  - name: stg_orders
    description: >-
      One retained source row per order_id with unchanged source customer reference,
      literal lifecycle status and lineage. Five dates use timestamp without time
      zone; no timezone is invented. Purchase and estimate are mandatory; approval,
      carrier handoff and customer delivery are nullable. Exactly empty source text
      becomes null. Only canonical ASCII YYYY-MM-DD HH:MM:SS with real calendar
      dates, hours 00-23 and minutes/seconds 00-59 is accepted, within the Phase 2
      nanosecond domain at whole seconds: 1677-09-21 00:12:44 through 2262-04-11
      23:47:16 inclusive. Nonempty rejected dates remain queryable as typed null and
      fail the aggregate source-domain test. Source missingness is separate from
      typed absence; delivered-missing diagnostics use typed absence. All six
      pairwise actual-event reversals are retained and flagged, with false when an
      operand is absent. Estimate is not an actual event. No duration, KPI eligibility,
      repaired event, child presence join or completion inference is added.
    config:
      materialized: view
      schema: staging
    columns:
      - name: _load_id
        data_type: uuid
        description: Unchanged immutable source snapshot identity from raw.
        data_tests:
          - not_null
      - name: _source_row
        data_type: bigint
        description: Unchanged one-based logical CSV record ordinal within the load.
        data_tests:
          - not_null
      - name: order_id
        data_type: text
        description: Mandatory literal lowercase hexadecimal source order key.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_type: text
        description: Mandatory order-linked source customer reference, preserving spelling.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        data_type: text
        description: Exact source lifecycle status; do not infer or normalize completion.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [created, approved, invoiced, processing, shipped, delivered, unavailable, canceled]
      - name: order_purchase_timestamp
        data_type: timestamp without time zone
        description: Mandatory purchase timestamp; source timezone unspecified.
        data_tests:
          - not_null
      - name: order_approved_at
        data_type: timestamp without time zone
        description: Nullable approval timestamp, when recorded in the source.
      - name: order_delivered_carrier_date
        data_type: timestamp without time zone
        description: Nullable recorded carrier handoff timestamp.
      - name: order_delivered_customer_date
        data_type: timestamp without time zone
        description: Nullable recorded actual customer delivery timestamp.
      - name: order_estimated_delivery_date
        data_type: timestamp without time zone
        description: Mandatory source delivery estimate; not an actual lifecycle event.
        data_tests:
          - not_null
      - name: is_missing_approval
        data_type: boolean
        description: Approval source text was NULL or exactly empty, independent of parsing.
        data_tests:
          - not_null
      - name: is_missing_carrier_delivery
        data_type: boolean
        description: Carrier handoff source text was NULL or exactly empty, independent of parsing.
        data_tests:
          - not_null
      - name: is_missing_customer_delivery
        data_type: boolean
        description: Customer delivery source text was NULL or exactly empty, independent of parsing.
        data_tests:
          - not_null
      - name: is_delivered_missing_approval
        data_type: boolean
        description: Exact delivered status has no typed approval event; rejected text also fails domains.
        data_tests:
          - not_null
      - name: is_delivered_missing_carrier_delivery
        data_type: boolean
        description: Exact delivered status has no typed carrier event; rejected text also fails domains.
        data_tests:
          - not_null
      - name: is_delivered_missing_customer_delivery
        data_type: boolean
        description: Exact delivered status has no typed customer event; rejected text also fails domains.
        data_tests:
          - not_null
      - name: is_approval_before_purchase
        data_type: boolean
        description: Typed approval precedes purchase; false when either event is absent.
        data_tests:
          - not_null
      - name: is_carrier_delivery_before_purchase
        data_type: boolean
        description: Typed carrier handoff precedes purchase; false when either event is absent.
        data_tests:
          - not_null
      - name: is_customer_delivery_before_purchase
        data_type: boolean
        description: Typed customer delivery precedes purchase; false when either event is absent.
        data_tests:
          - not_null
      - name: is_carrier_delivery_before_approval
        data_type: boolean
        description: Typed carrier handoff precedes approval; false when either event is absent.
        data_tests:
          - not_null
      - name: is_customer_delivery_before_approval
        data_type: boolean
        description: Typed customer delivery precedes approval; false when either event is absent.
        data_tests:
          - not_null
      - name: is_customer_delivery_before_carrier_delivery
        data_type: boolean
        description: Typed customer delivery precedes carrier handoff; false when either event is absent.
        data_tests:
          - not_null
