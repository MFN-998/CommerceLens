[project]
name = "commercelens"
version = "0.1.0"
description = "CommerceLens e-commerce analytics and decision intelligence"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic-settings==2.15.0",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.0",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
